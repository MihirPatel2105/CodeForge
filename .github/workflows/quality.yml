name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Limiter tests use isolated fake Redis; a shared service makes unrelated
    # registration fixtures exhaust the same IP-based counter across the suite.
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: pytest -q
      - name: Isolated backend unit checks
        run: |
          ruff check app/core/preview_parameters.py unit_tests
          ruff format --check app/core/preview_parameters.py unit_tests
          PYTHONPATH=. pytest -q unit_tests --confcutdir=unit_tests
      - name: Preview response metadata
        run: |
          ruff check --config pyproject.toml ../sandbox/preview_request.py ../sandbox/tests
          ruff format --check --config pyproject.toml ../sandbox/preview_request.py ../sandbox/tests
          PYTHONPATH=. pytest -q ../sandbox/tests --confcutdir=../sandbox/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - name: Browser regression checks
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/codeforge-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          E2E_BASE_URL=http://127.0.0.1:3000 npx playwright test tests/e2e/projects-retry.spec.ts tests/e2e/projects-search.spec.ts tests/e2e/project-time-ui.spec.ts tests/e2e/profile-ui.spec.ts tests/e2e/try-api-ui.spec.ts tests/e2e/api-playground.spec.ts tests/e2e/auth-recovery.spec.ts tests/e2e/workspace-experience.spec.ts tests/e2e/run-problems.spec.ts tests/e2e/run-history-loading.spec.ts tests/e2e/run-dashboard-layout.spec.ts tests/e2e/run-approval-stream.spec.ts tests/e2e/code-folders.spec.ts tests/e2e/action-feedback.spec.ts tests/e2e/run-retry.spec.ts tests/e2e/timeline-filters.spec.ts tests/e2e/admin-operations.spec.ts tests/e2e/admin-live-search.spec.ts tests/e2e/admin-user-delete-ui.spec.ts tests/e2e/admin-security.spec.ts tests/e2e/security-hardening.spec.ts tests/e2e/motion-ui.spec.ts tests/e2e/landing-scroll.spec.ts tests/e2e/editorial-pages.spec.ts
      - name: Component interaction regression checks
        run: E2E_BASE_URL=http://127.0.0.1:3000 npx playwright test tests/e2e/vengeance-ui.spec.ts tests/e2e/component-enhancements.spec.ts tests/e2e/desktop-recommendation.spec.ts tests/e2e/command-palette.spec.ts tests/e2e/agent-network-preview.spec.ts tests/e2e/api-machine-preview.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results

  sandbox-smoke:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: docker build -t codeforge-sandbox:latest ./sandbox
        working-directory: .
      - run: RUN_LIVE_DOCKER=1 pytest -q tests/test_sandbox_live.py tests/test_compatibility_route.py
