services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kept for the test suite, which deliberately stays on this local instance rather
  # than following the app to Atlas (see conftest.py) — offline, fast, and immune to
  # a real cluster's network latency or free-tier limits. The app itself no longer
  # depends on this service; MONGO_URI in backend/.env now points at Atlas.
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      LANGFUSE_HOST: http://langfuse:3000
      REDIS_URL: redis://redis:6379/0
      DOCKER_HOST: ${SANDBOX_DOCKER_HOST:-tcp://sandbox.invalid:2376}
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /run/codeforge/docker-client
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      # Operational scripts (preflight, smoke tests) are run with `compose exec` and
      # need the in-container view of the world — Ollama in particular is only at
      # `host.docker.internal` from in here.
      - ./backend/scripts:/app/scripts
      # Sandboxes require a separate TLS daemon; never expose the host socket.
      - ${SANDBOX_DOCKER_CERTS_DIR:-./docker-client}:/run/codeforge/docker-client:ro
    depends_on:
      redis:
        condition: service_healthy

  # Langfuse's own storage (Postgres). Internal to this container only — not
  # exposed to the host and not used for any CodeForge application data,
  # which lives exclusively in `mongo` above.
  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-nextauth-secret-change-me
      SALT: dev-salt-change-me
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy

volumes:
  mongo_data:
  langfuse_db_data:
