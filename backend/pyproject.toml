[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Email HTML is table markup with inline styles (mail clients strip <style> blocks), so its
# style strings are long by nature; splitting them mid-attribute would only hurt reading.
"app/core/email.py" = ["E501"]
"app/core/email_templates.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
